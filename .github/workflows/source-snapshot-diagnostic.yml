name: EDIS raw-head source snapshot diagnostic

'on':
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: json, iconv
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - name: Record exact raw Head
        run: |
          git rev-parse HEAD | tee RAW_HEAD_SHA.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edis-raw-head-source-snapshot
          path: |
            .
            !.git
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
