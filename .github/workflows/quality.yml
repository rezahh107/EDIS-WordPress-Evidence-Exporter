name: EDIS quality gates

'on':
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: edis-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-integrity:
    name: Composer metadata and lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'EXPECTED_HEAD_SHA=%s\nACTUAL_HEAD_SHA=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: json, iconv
      - run: test -f composer.lock
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress --dry-run
      - run: composer audit --locked

  php-matrix:
    name: PHP ${{ matrix.php }}
    needs: composer-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'EXPECTED_HEAD_SHA=%s\nACTUAL_HEAD_SHA=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: json, iconv
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: vendor/bin/phpunit --configuration phpunit.xml.dist
      - name: Release-blocking PHP compatibility and WordPress security
        if: matrix.php == '8.4'
        run: vendor/bin/phpcs --standard=phpcs.xml.dist
      - name: Advisory full WordPress boundary report
        if: matrix.php == '8.4'
        continue-on-error: true
        run: vendor/bin/phpcs --standard=phpcs-wordpress-boundary.xml --report=summary
      - run: php -d error_reporting=E_ALL -d display_errors=1 tests/runtime-smoke.php
      - if: matrix.php == '8.4'
        run: npm ci
      - if: matrix.php == '8.4'
        run: npm run lint:js && npm run lint:css && npm run lint:workflows:strict

  plugin-check:
    name: Plugin Check / WordPress ${{ matrix.wordpress }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.5.8', '7.0']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'EXPECTED_HEAD_SHA=%s\nACTUAL_HEAD_SHA=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli, json, iconv
      - name: Install verified WP-CLI 2.12.0
        env:
          WP_CLI_SHA512: be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832
        run: |
          curl -fsSLo /tmp/wp-cli.phar https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          printf '%s  %s\n' "$WP_CLI_SHA512" /tmp/wp-cli.phar | sha512sum --check --strict
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          wp --version | grep -Fx 'WP-CLI 2.12.0'
      - name: Install pinned WordPress and Plugin Check
        run: |
          mkdir -p /tmp/wordpress/wp-content/plugins
          wp core download --path=/tmp/wordpress --version=${{ matrix.wordpress }} --force
          wp config create --path=/tmp/wordpress --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp config set EDIS_EVIDENCE_PRIVATE_STORAGE_DIR /tmp/edis-private --path=/tmp/wordpress --type=constant
          wp config set WP_DEBUG true --raw --path=/tmp/wordpress --type=constant
          wp config set WP_DEBUG_LOG true --raw --path=/tmp/wordpress --type=constant
          wp config set SCRIPT_DEBUG true --raw --path=/tmp/wordpress --type=constant
          wp config set ELEMENTOR_DEBUG true --raw --path=/tmp/wordpress --type=constant
          wp core install --path=/tmp/wordpress --url=http://localhost --title=EDIS --admin_user=admin --admin_password=admin --admin_email=admin@example.test --skip-email
          mkdir -p /tmp/plugin-build/edis-evidence-exporter
          rsync -a --delete --exclude-from="$GITHUB_WORKSPACE/.distignore" "$GITHUB_WORKSPACE/" /tmp/plugin-build/edis-evidence-exporter/
          ln -s /tmp/plugin-build/edis-evidence-exporter /tmp/wordpress/wp-content/plugins/edis-evidence-exporter
          wp plugin install plugin-check --version=2.0.0 --activate --path=/tmp/wordpress
          wp plugin activate edis-evidence-exporter --path=/tmp/wordpress
      - name: Static Plugin Check
        run: wp plugin check edis-evidence-exporter --path=/tmp/wordpress
      - name: Runtime Plugin Check
        run: wp plugin check edis-evidence-exporter --path=/tmp/wordpress --require=/tmp/wordpress/wp-content/plugins/plugin-check/cli.php
      - name: Verify Site Health, privacy hooks and filesystem preflight
        run: |
          wp eval '
            $tests = apply_filters("site_status_tests", []);
            if (! isset($tests["direct"]["edis_evidence_runtime"], $tests["direct"]["edis_evidence_cron"], $tests["async"]["edis_evidence_storage"])) {
                fwrite(STDERR, "EDIS Site Health registration is incomplete.\n");
                exit(1);
            }
            $exporters = apply_filters("wp_privacy_personal_data_exporters", []);
            $erasers = apply_filters("wp_privacy_personal_data_erasers", []);
            if (! isset($exporters["edis-evidence-exporter"], $erasers["edis-evidence-exporter"])) {
                fwrite(STDERR, "EDIS privacy registration is incomplete.\n");
                exit(1);
            }
            $report = EDIS\EvidenceExporter\WordPress\WordPressFilesystemPreflightAdapter::report(new EDIS\EvidenceExporter\Infrastructure\Support\PrivateStorage());
            if (($report["background_export_policy"] ?? null) !== "ALLOW_ONLY_AFTER_EDIS_STORAGE_SELF_TEST") {
                fwrite(STDERR, "EDIS filesystem policy mismatch.\n");
                exit(1);
            }
          ' --path=/tmp/wordpress
      - name: Verify healthy EDIS admin menu
        if: matrix.wordpress == '7.0'
        run: |
          cat > /tmp/edis-admin-context.php <<'PHP'
          <?php
          if (! defined('WP_ADMIN')) {
              define('WP_ADMIN', true);
          }
          PHP
          wp --require=/tmp/edis-admin-context.php eval '
            $admin = get_user_by("login", "admin");
            if (! $admin instanceof WP_User) {
                fwrite(STDERR, "EDIS healthy-admin fixture has no administrator.\n");
                exit(1);
            }
            wp_set_current_user($admin->ID);
            global $menu, $submenu;
            $menu = [];
            $submenu = [];
            do_action("admin_menu");
            $edis_menu = array_values(array_filter(
                $menu,
                static fn ($item): bool => is_array($item) && (($item[2] ?? null) === "edis-evidence")
            ));
            if (count($edis_menu) !== 1) {
                fwrite(STDERR, "Healthy EDIS top-level menu is missing or duplicated.\n");
                exit(1);
            }
            $edis_submenu = is_array($submenu["edis-evidence"] ?? null) ? $submenu["edis-evidence"] : [];
            $required = [
                "edis-evidence",
                "edis-evidence-create",
                "edis-evidence-sources",
                "edis-evidence-coverage",
                "edis-evidence-diagnostics",
                "edis-evidence-settings",
                "edis-evidence-help",
            ];
            $slugs = array_values(array_filter(array_map(
                static fn ($item): string => is_array($item) && is_string($item[2] ?? null) ? $item[2] : "",
                $edis_submenu
            )));
            foreach ($required as $required_slug) {
                if (! in_array($required_slug, $slugs, true)) {
                    fwrite(STDERR, "Healthy EDIS menu is incomplete: {$required_slug}.\n");
                    exit(1);
                }
            }
            if (count(array_filter($slugs, static fn (string $slug): bool => $slug === "edis-evidence-diagnostics")) !== 1) {
                fwrite(STDERR, "Healthy EDIS diagnostics entry is duplicated.\n");
                exit(1);
            }
            $degraded_titles = array_filter(
                $edis_submenu,
                static fn ($item): bool => is_array($item) && (($item[0] ?? null) === "Diagnostics / Recovery")
            );
            if ($degraded_titles !== []) {
                fwrite(STDERR, "Degraded recovery shell leaked into healthy mode.\n");
                exit(1);
            }
          ' --path=/tmp/wordpress
      - name: Verify degraded EDIS admin recovery shell
        if: matrix.wordpress == '7.0'
        run: |
          wp eval '
            $admin = get_user_by("login", "admin");
            if (! $admin instanceof WP_User) {
                fwrite(STDERR, "EDIS degraded-admin fixture has no administrator.\n");
                exit(1);
            }
            wp_set_current_user($admin->ID);
            remove_all_actions("admin_menu");
            global $menu, $submenu, $wp_filter;
            $menu = [];
            $submenu = [];
            $rest_before = isset($wp_filter["rest_api_init"]) ? count($wp_filter["rest_api_init"]->callbacks) : 0;
            $worker_before = isset($wp_filter["edis_process_export_job"]) ? count($wp_filter["edis_process_export_job"]->callbacks) : 0;
            $storage = new EDIS\EvidenceExporter\Infrastructure\Support\PrivateStorage();
            $degraded = new EDIS\EvidenceExporter\WordPress\DegradedModeIntegration(
                $storage,
                "EDIS_CONFIGURATION_INVALID",
                ["storage_self_test" => $storage->selfTest()]
            );
            $degraded->register();
            do_action("admin_menu");
            $edis_menu = array_values(array_filter(
                $menu,
                static fn ($item): bool => is_array($item) && (($item[2] ?? null) === "edis-evidence")
            ));
            if (count($edis_menu) !== 1) {
                fwrite(STDERR, "Degraded EDIS top-level menu is missing or duplicated.\n");
                exit(1);
            }
            $edis_submenu = is_array($submenu["edis-evidence"] ?? null) ? $submenu["edis-evidence"] : [];
            $slugs = array_values(array_filter(array_map(
                static fn ($item): string => is_array($item) && is_string($item[2] ?? null) ? $item[2] : "",
                $edis_submenu
            )));
            if (! in_array("edis-evidence-diagnostics", $slugs, true)) {
                fwrite(STDERR, "Degraded EDIS Diagnostics / Recovery menu is missing.\n");
                exit(1);
            }
            foreach (["edis-evidence-create", "edis-evidence-settings", "edis-evidence-sources", "edis-evidence-coverage"] as $forbidden_slug) {
                if (in_array($forbidden_slug, $slugs, true)) {
                    fwrite(STDERR, "Operational EDIS menu leaked into degraded mode: {$forbidden_slug}.\n");
                    exit(1);
                }
            }
            $rest_after = isset($wp_filter["rest_api_init"]) ? count($wp_filter["rest_api_init"]->callbacks) : 0;
            $worker_after = isset($wp_filter["edis_process_export_job"]) ? count($wp_filter["edis_process_export_job"]->callbacks) : 0;
            if ($rest_before !== $rest_after || $worker_before !== $worker_after) {
                fwrite(STDERR, "Degraded recovery registration exposed operational execution hooks.\n");
                exit(1);
            }
            ob_start();
            $degraded->renderRecoveryPage();
            $html = (string) ob_get_clean();
            if (! str_contains($html, "EDIS_CONFIGURATION_INVALID") || ! str_contains($html, "Diagnostics / Recovery")) {
                fwrite(STDERR, "Degraded recovery content is incomplete.\n");
                exit(1);
            }
            if (str_contains($html, ">Create Export<") || str_contains($html, "worker-test")) {
                fwrite(STDERR, "Operational controls leaked into degraded recovery content.\n");
                exit(1);
            }
            $subscriber_id = wp_create_user("edis-degraded-viewer", wp_generate_password(24), "edis-degraded-viewer@example.test");
            if (is_wp_error($subscriber_id)) {
                fwrite(STDERR, "Could not create degraded authorization fixture.\n");
                exit(1);
            }
            (new WP_User($subscriber_id))->set_role("subscriber");
            wp_set_current_user($subscriber_id);
            ob_start();
            $degraded->renderRecoveryPage();
            $unauthorized_html = (string) ob_get_clean();
            if (trim($unauthorized_html) !== "") {
                fwrite(STDERR, "Unauthorized user received degraded recovery content.\n");
                exit(1);
            }
            wp_set_current_user($admin->ID);
          ' --path=/tmp/wordpress
      - name: Verify retention-disabled uninstall
        if: matrix.wordpress == '7.0'
        run: |
          ROOT=$(wp eval 'echo (new EDIS\EvidenceExporter\Infrastructure\Support\PrivateStorage())->root();' --path=/tmp/wordpress)
          wp option update edis_evidence_retain_data_on_uninstall 0 --path=/tmp/wordpress
          wp plugin uninstall edis-evidence-exporter --deactivate --path=/tmp/wordpress
          test ! -e "$ROOT"
          ! wp option get edis_evidence_installed_version --path=/tmp/wordpress
      - name: Require zero EDIS-origin debug output
        run: |
          if [ -f /tmp/wordpress/wp-content/debug.log ]; then
            ! grep -E 'EDIS|edis-evidence-exporter' /tmp/wordpress/wp-content/debug.log
          fi

  elementor-smoke:
    name: Elementor 4.1.3 smoke / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'EXPECTED_HEAD_SHA=%s\nACTUAL_HEAD_SHA=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli, json, iconv
      - name: Install verified WP-CLI 2.12.0
        env:
          WP_CLI_SHA512: be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832
        run: |
          curl -fsSLo /tmp/wp-cli.phar https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          printf '%s  %s\n' "$WP_CLI_SHA512" /tmp/wp-cli.phar | sha512sum --check --strict
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          wp --version | grep -Fx 'WP-CLI 2.12.0'
      - name: Install pinned WordPress and Elementor
        run: |
          mkdir -p /tmp/wordpress/wp-content/plugins
          wp core download --path=/tmp/wordpress --version=7.0 --force
          wp config create --path=/tmp/wordpress --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp config set EDIS_EVIDENCE_PRIVATE_STORAGE_DIR /tmp/edis-private --path=/tmp/wordpress --type=constant
          wp config set WP_DEBUG true --raw --path=/tmp/wordpress --type=constant
          wp config set WP_DEBUG_LOG true --raw --path=/tmp/wordpress --type=constant
          wp config set SCRIPT_DEBUG true --raw --path=/tmp/wordpress --type=constant
          wp config set ELEMENTOR_DEBUG true --raw --path=/tmp/wordpress --type=constant
          wp core install --path=/tmp/wordpress --url=http://localhost --title=EDIS --admin_user=admin --admin_password=admin --admin_email=admin@example.test --skip-email
          mkdir -p /tmp/plugin-build/edis-evidence-exporter
          rsync -a --delete --exclude-from="$GITHUB_WORKSPACE/.distignore" "$GITHUB_WORKSPACE/" /tmp/plugin-build/edis-evidence-exporter/
          ln -s /tmp/plugin-build/edis-evidence-exporter /tmp/wordpress/wp-content/plugins/edis-evidence-exporter
          wp plugin install elementor --version=4.1.3 --activate --path=/tmp/wordpress
          wp plugin activate edis-evidence-exporter --path=/tmp/wordpress
      - name: Verify Elementor and EDIS deterministic runtime
        run: |
          wp eval '
            if (! did_action("elementor/loaded")) {
                fwrite(STDERR, "Elementor did not load.\n");
                exit(1);
            }
            $ready = EDIS\EvidenceExporter\Infrastructure\Support\CanonicalJson::environmentReady();
            if (! $ready) {
                fwrite(STDERR, "EDIS-CJ-2 runtime rejected.\n");
                exit(1);
            }
            $result = (new EDIS\EvidenceExporter\Infrastructure\Support\PrivateStorage())->selfTest();
            if (($result["state"] ?? null) !== "PASS") {
                fwrite(STDERR, "Private storage self-test failed.\n");
                exit(1);
            }
          ' --path=/tmp/wordpress
      - name: Run real EDIS export completion gate
        if: matrix.php == '8.4'
        run: wp eval-file "$GITHUB_WORKSPACE/tests/integration/real-export-completion.php" --path=/tmp/wordpress
      - name: Require zero EDIS-origin debug output
        run: |
          if [ -f /tmp/wordpress/wp-content/debug.log ]; then
            ! grep -E 'EDIS|edis-evidence-exporter' /tmp/wordpress/wp-content/debug.log
          fi

  multisite-runtime:
    name: WordPress 7.0 multisite lifecycle and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'EXPECTED_HEAD_SHA=%s\nACTUAL_HEAD_SHA=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli, json, iconv
      - name: Install verified WP-CLI 2.12.0
        env:
          WP_CLI_SHA512: be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832
        run: |
          curl -fsSLo /tmp/wp-cli.phar https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          printf '%s  %s\n' "$WP_CLI_SHA512" /tmp/wp-cli.phar | sha512sum --check --strict
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          wp --version | grep -Fx 'WP-CLI 2.12.0'
      - name: Install WordPress multisite and network-activate EDIS
        run: |
          mkdir -p /tmp/wordpress/wp-content/plugins /tmp/plugin-build/edis-evidence-exporter
          wp core download --path=/tmp/wordpress --version=7.0 --force
          wp config create --path=/tmp/wordpress --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp config set EDIS_EVIDENCE_PRIVATE_STORAGE_DIR /tmp/edis-multisite-private --path=/tmp/wordpress --type=constant
          wp config set WP_DEBUG true --raw --path=/tmp/wordpress --type=constant
          wp config set WP_DEBUG_LOG true --raw --path=/tmp/wordpress --type=constant
          wp config set SCRIPT_DEBUG true --raw --path=/tmp/wordpress --type=constant
          wp core install --path=/tmp/wordpress --url=http://localhost --title=EDIS --admin_user=admin --admin_password=admin --admin_email=admin@example.test --skip-email
          wp core multisite-convert --path=/tmp/wordpress --title='EDIS Network' --base=/
          rsync -a --delete --exclude-from="$GITHUB_WORKSPACE/.distignore" "$GITHUB_WORKSPACE/" /tmp/plugin-build/edis-evidence-exporter/
          ln -s /tmp/plugin-build/edis-evidence-exporter /tmp/wordpress/wp-content/plugins/edis-evidence-exporter
          wp plugin activate edis-evidence-exporter --network --path=/tmp/wordpress --url=http://localhost
      - name: Create secondary site
        run: |
          SITE_TWO_ID=$(wp site create --path=/tmp/wordpress --url=http://localhost --slug=site-two --title='Site Two' --email=admin@example.test --porcelain)
          SITE_TWO_URL=$(EDIS_SITE_ID="$SITE_TWO_ID" wp eval 'echo get_site_url((int) getenv("EDIS_SITE_ID"));' --path=/tmp/wordpress --url=http://localhost)
          printf 'SITE_TWO_ID=%s\n' "$SITE_TWO_ID" >> "$GITHUB_ENV"
          printf 'SITE_TWO_URL=%s\n' "$SITE_TWO_URL" >> "$GITHUB_ENV"
      - name: Verify lifecycle initialization on both sites
        run: |
          wp eval '
            $stored = get_option("edis_evidence_installed_version");
            $expected = EDIS_EVIDENCE_EXPORTER_VERSION;
            if ($stored !== $expected) {
                fwrite(STDERR, "Installed version mismatch: {$stored} != {$expected}.\n");
                exit(1);
            }
          ' --path=/tmp/wordpress --url=http://localhost
          wp eval '
            $stored = get_option("edis_evidence_installed_version");
            $expected = EDIS_EVIDENCE_EXPORTER_VERSION;
            if ($stored !== $expected) {
                fwrite(STDERR, "Installed version mismatch: {$stored} != {$expected}.\n");
                exit(1);
            }
          ' --path=/tmp/wordpress --url="$SITE_TWO_URL"
      - name: Verify per-site private storage isolation
        run: |
          wp edis storage self-test --path=/tmp/wordpress --url=http://localhost
          wp edis storage self-test --path=/tmp/wordpress --url="$SITE_TWO_URL"
          ROOT_ONE=$(wp eval 'echo (new EDIS\EvidenceExporter\Infrastructure\Support\PrivateStorage())->root();' --path=/tmp/wordpress --url=http://localhost)
          ROOT_TWO=$(wp eval 'echo (new EDIS\EvidenceExporter\Infrastructure\Support\PrivateStorage())->root();' --path=/tmp/wordpress --url="$SITE_TWO_URL")
          test "$ROOT_ONE" != "$ROOT_TWO"
          [[ "$ROOT_ONE" == *site-* ]]
          [[ "$ROOT_TWO" == *site-* ]]
      - name: Verify multisite Site Health registration
        run: |
          wp eval '
            $tests = apply_filters("site_status_tests", []);
            foreach (["edis_evidence_runtime", "edis_evidence_cron"] as $id) {
                if (! isset($tests["direct"][$id])) {
                    fwrite(STDERR, "Missing Site Health test: {$id}.\n");
                    exit(1);
                }
            }
          ' --path=/tmp/wordpress --url=http://localhost
      - name: Verify multisite WP-CLI commands
        run: |
          wp edis worker status --path=/tmp/wordpress --url=http://localhost
          wp edis jobs repair --path=/tmp/wordpress --url=http://localhost
      - name: Verify network deactivation cleans scheduled hooks
        run: |
          wp plugin deactivate edis-evidence-exporter --network --path=/tmp/wordpress --url=http://localhost
          wp eval '
            if (false !== wp_next_scheduled("edis_cleanup_export_files")) {
                fwrite(STDERR, "Cleanup hook remains scheduled after deactivation.\n");
                exit(1);
            }
            $role = get_role("administrator");
            if ($role instanceof WP_Role && $role->has_cap("edis_export_evidence")) {
                fwrite(STDERR, "EDIS capability remains after network deactivation.\n");
                exit(1);
            }
          ' --path=/tmp/wordpress --url=http://localhost
          wp eval '
            $role = get_role("administrator");
            if ($role instanceof WP_Role && $role->has_cap("edis_export_evidence")) {
                fwrite(STDERR, "EDIS capability remains on secondary site.\n");
                exit(1);
            }
          ' --path=/tmp/wordpress --url="$SITE_TWO_URL"
      - name: Require zero EDIS-origin debug output
        run: |
          if [ -f /tmp/wordpress/wp-content/debug.log ]; then
            ! grep -E 'EDIS|edis-evidence-exporter' /tmp/wordpress/wp-content/debug.log
          fi
