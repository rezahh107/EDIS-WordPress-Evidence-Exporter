name: PR8 controller authority synchronization

on:
  push:
    branches:
      - agent/edis-canonical-llm-diagnostic-record-v1
    paths:
      - .github/workflows/pr8-controller-authority-sync.yml

permissions:
  contents: write

jobs:
  synchronize:
    if: contains(github.event.head_commit.message, '[sync-pr8-controller-authority]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - name: Regenerate critical-file authority
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          target = Path('config/critical-files.json')
          authority = json.loads(target.read_text(encoding='utf-8'))
          files = authority.get('files')
          if not isinstance(files, dict) or not files:
              raise SystemExit('Critical-file authority is unavailable.')
          for relative in sorted(files):
              path = Path(relative)
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f'Critical path unavailable: {relative}')
              files[relative] = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
          target.write_text(json.dumps(authority, ensure_ascii=False, sort_keys=True, separators=(',', ':')), encoding='utf-8')
          PY
      - name: Commit synchronized authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/critical-files.json
          git diff --cached --check
          git commit -m "chore: synchronize canonical REST controller authority"
          git push origin HEAD:agent/edis-canonical-llm-diagnostic-record-v1
