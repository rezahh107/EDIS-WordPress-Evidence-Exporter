name: EDIS manifest and PHPUnit diagnostic

'on':
  push:
    branches:
      - agent/edis-3.7.15-payload-shape-closure
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: json, iconv
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Show PHPUnit discovery
        run: |
          vendor/bin/phpunit --configuration phpunit.xml.dist --list-tests
          vendor/bin/phpunit --configuration phpunit.xml.dist --debug
      - name: Run isolated local harness
        run: php tests/run-local.php
