name: EDIS bounded root-complete finalization

'on':
  push:
    branches:
      - agent/edis-canonical-llm-diagnostic-record-v1
    paths:
      - .github/workflows/finalize-root-complete.yml
      - tools/validation/finalize-root-complete.py

permissions:
  contents: write

concurrency:
  group: edis-bounded-root-complete-finalization
  cancel-in-progress: false

jobs:
  finalize:
    name: Finalize authorities and focused contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Verify exact seed checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: json, iconv
      - name: Apply bounded finalization
        run: |
          python -m py_compile tools/validation/finalize-root-complete.py
          python tools/validation/finalize-root-complete.py
          rm -rf tools/validation/__pycache__
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
      - name: Validate complete candidate
        run: |
          set -euo pipefail
          find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          vendor/bin/phpunit --configuration phpunit.xml.dist
          vendor/bin/phpcs --standard=phpcs.xml.dist
          php -d error_reporting=E_ALL -d display_errors=1 tests/runtime-smoke.php
          npm run lint:js
          npm run lint:css
          npm run lint:workflows:strict
          python tests/release-authority-314.py
          rm -rf /tmp/edis-final-a /tmp/edis-final-b
          python tools/release/build-release.py --root . --output /tmp/edis-final-a
          python tools/release/build-release.py --root . --output /tmp/edis-final-b
          diff -qr /tmp/edis-final-a /tmp/edis-final-b
          git diff --check
          test ! -e .github/workflows/finalize-root-complete.yml
          test ! -e tools/validation/finalize-root-complete.py
      - name: Commit and push bounded result
        env:
          TARGET_BRANCH: agent/edis-canonical-llm-diagnostic-record-v1
          SEED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$SEED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No finalization changes were produced.' >&2; exit 1; }
          git commit -m 'test: finalize root-complete diagnostic contracts'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'RESULTING_HEAD_SHA=%s\n' "$(git rev-parse HEAD)"
