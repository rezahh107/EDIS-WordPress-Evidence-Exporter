name: EDIS 3.7.14 exact final qualification

'on':
  push:
    branches:
      - agent/edis-wp-correctness-closure-v3.7.14

permissions:
  contents: write

concurrency:
  group: edis-314-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mysqli, json, iconv
      - name: Install verified WP-CLI 2.12.0
        env:
          WP_CLI_SHA512: be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832
        run: |
          curl -fsSLo /tmp/wp-cli.phar https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          printf '%s  %s\n' "$WP_CLI_SHA512" /tmp/wp-cli.phar | sha512sum --check --strict
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          wp --version | grep -Fx 'WP-CLI 2.12.0'
      - name: Finalize version, release authority, docs and critical hashes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path.cwd()
          version = '3.7.14'

          def replace_once(path: str, old: str, new: str) -> None:
              p = root / path
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('edis-evidence-exporter.php', ' * Version: 3.7.13', ' * Version: 3.7.14')
          replace_once('edis-evidence-exporter.php', "define( 'EDIS_EVIDENCE_EXPORTER_VERSION', '3.7.13' );", "define( 'EDIS_EVIDENCE_EXPORTER_VERSION', '3.7.14' );")
          replace_once('edis-evidence-exporter.php', "define( 'EDIS_EVIDENCE_BUILD_PLATFORM_VERSION', '3.7.13' );", "define( 'EDIS_EVIDENCE_BUILD_PLATFORM_VERSION', '3.7.14' );")

          package = json.loads((root / 'package.json').read_text(encoding='utf-8'))
          package['version'] = version
          (root / 'package.json').write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          package_lock = json.loads((root / 'package-lock.json').read_text(encoding='utf-8'))
          package_lock['version'] = version
          package_lock['packages']['']['version'] = version
          (root / 'package-lock.json').write_text(json.dumps(package_lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = text.replace('Version `3.7.13`, generated by EDIS Enterprise Deterministic Build Platform `3.7.13`.', 'Version `3.7.14`, generated by EDIS Enterprise Deterministic Build Platform `3.7.14`.', 1)
          old_intro = 'Version 3.7.13 is a bounded degraded-admin recovery patch. Unsupported deterministic PHP runtime is handled **before `Bootstrap`** by `edis_evidence_exporter_runtime_notice`; that pre-Bootstrap path does not register the recovery shell. Once the deterministic runtime is supported and `Bootstrap` runs, the three current fail-closed degraded causes—installation-integrity failure, invalid configuration, and private-storage failure—route through `DegradedModeIntegration`, which restores a minimal `EDIS Evidence` Diagnostics / Recovery surface without initializing the operational export graph. Healthy `AdminModule` behavior is unchanged, frozen evidence contracts remain unchanged, and worker implementation compatibility deliberately remains `3.7.12`.'
          new_intro = 'Version 3.7.14 is the bounded correctness-closure release for exported-source privacy projection, truthful failed-observation semantics, per-artifact temporal provenance, manifest-authoritative release inventory, generated-validation output isolation, machine-checked collector documentation, truthful recovery scheduling state, and exact final-build qualification. Frozen public evidence contracts remain unchanged; worker implementation compatibility advances to `3.7.14`, so incomplete jobs created under 3.7.12 must be recreated.'
          if old_intro not in text:
              raise SystemExit('README current-release introduction drifted')
          text = text.replace(old_intro, new_intro, 1)
          marker = '## 3.7.13 degraded diagnostics recovery\n'
          section = '''## 3.7.14 correctness closure\n\nRelease 3.7.14 applies one shared recursive/path-aware privacy projection before exported source evidence is committed, distinguishes successful empty observations from failed Elementor/WordPress observations, stamps committed artifacts with truthful observation/derivation time, and persists one packaging start time for deterministic retries. `elementor_document_source` continues to use the immutable snapshot capture time.\n\nRelease construction is now manifest-authoritative: install inventory comes from `plugin.manifest.json` entries with `installable=true`, source inventory comes from the manifest plus `composer.lock`, undeclared ordinary files fail closed, and the release report binds plugin/worker identity to manifest, critical-file and source-inventory SHA-256 fingerprints. Generated validation evidence remains under `release-build/validation-evidence/` and is never source authority.\n\nRetryable failures clear the active REST lease state before using the existing recovery scheduler and persist the scheduler's actual result. Non-retryable integrity failures have no future retry deadline or active recovery schedule. Collector encyclopedia Technical IDs/schema versions are checked against the active manifest. Bundle Schema `3.3.0`, Shared Artifact Envelope `2.0.0`, Package Manifest `2.1.0`, Selection Snapshot `1.2.0`, EDIS-CJ-2 and EDIS-ZIP-1 remain unchanged.\n\n'''
          if '## 3.7.14 correctness closure' not in text:
              if marker not in text:
                  raise SystemExit('README 3.7.13 historical marker missing')
              text = text.replace(marker, section + marker, 1)
          text = text.replace('version 3.7.13 preserves it unchanged', 'version 3.7.14 preserves it unchanged', 1)
          text = text.replace('In `WP_ENVIRONMENT_TYPE=local`, EDIS 3.7.13 prefers', 'In `WP_ENVIRONMENT_TYPE=local`, EDIS 3.7.14 prefers', 1)
          readme.write_text(text, encoding='utf-8')

          wp_readme = root / 'readme.txt'
          text = wp_readme.read_text(encoding='utf-8')
          text = text.replace('Stable tag: 3.7.13', 'Stable tag: 3.7.14', 1)
          old_desc = 'Version 3.7.13 is a bounded degraded-admin recovery patch. Unsupported deterministic PHP runtime is handled before `Bootstrap` by `edis_evidence_exporter_runtime_notice` and does not register the recovery shell. After a supported runtime reaches Bootstrap, the three current degraded causes—installation-integrity failure, invalid configuration, and private-storage failure—use `DegradedModeIntegration` to retain a minimal EDIS Evidence Diagnostics / Recovery surface without initializing export services. Healthy-mode behavior and frozen public evidence contracts are unchanged, and worker implementation compatibility remains 3.7.12.'
          new_desc = 'Version 3.7.14 closes eight bounded correctness defects without changing frozen public evidence schemas: shared pre-commit privacy projection, failure-vs-empty observation truth, orchestrator-stamped provenance, manifest-authoritative release inventory and build fingerprinting, generated-validation output isolation, machine-checked collector documentation, truthful recovery scheduling state, and exact final-build runtime qualification. Worker implementation compatibility advances to 3.7.14.'
          if old_desc not in text:
              raise SystemExit('readme.txt current-release description drifted')
          text = text.replace(old_desc, new_desc, 1)
          old_faq = 'Jobs are compatible by worker implementation identity, not merely plugin release number. A persisted job created by worker implementation 3.7.11 must be recreated under 3.7.12. Release 3.7.13 intentionally keeps worker implementation compatibility at 3.7.12, so otherwise-compatible persisted 3.7.12 jobs are not invalidated by this admin-only patch.'
          new_faq = 'Jobs are compatible by worker implementation identity, not merely plugin release number. Release 3.7.14 advances the worker implementation identity to 3.7.14 because committed-artifact provenance and resume semantics changed. Incomplete jobs created under worker 3.7.12 are not migrated in place and must be recreated.'
          if old_faq not in text:
              raise SystemExit('readme.txt resume FAQ drifted')
          text = text.replace(old_faq, new_faq, 1)
          changelog_marker = '= 3.7.13 =\n'
          changelog_314 = '''= 3.7.14 =\n\n* Adds one shared recursive/path-aware pre-commit privacy projection for exported raw-value source evidence while preserving immutable private input bytes.\n* Distinguishes failed required observations from successful empty observations and preserves valid optional evidence only as bounded PARTIAL results.\n* Stores truthful per-component `observed_at` provenance and one persisted `packaging_started_at`; worker compatibility advances to 3.7.14.\n* Makes `plugin.manifest.json` the install/source release inventory authority, fails on undeclared ordinary files, and emits deterministic build fingerprints.\n* Keeps generated validation evidence under `release-build/validation-evidence/` and machine-checks both collector encyclopedias against active Technical IDs/schema versions.\n* Normalizes failed-job scheduling state through the existing recovery scheduler so released jobs cannot remain `REST_ADVANCE_ACTIVE`.\n* Preserves Bundle Schema 3.3.0, Shared Artifact Envelope 2.0.0, Package Manifest 2.1.0, Selection Snapshot 1.2.0, EDIS-CJ-2 and EDIS-ZIP-1.\n\n'''
          if '= 3.7.14 =' not in text:
              if changelog_marker not in text:
                  raise SystemExit('readme.txt changelog marker missing')
              text = text.replace(changelog_marker, changelog_314 + changelog_marker, 1)
          wp_readme.write_text(text, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          text = changelog.read_text(encoding='utf-8')
          if '## 3.7.14' not in text:
              marker = '## 3.7.13\n'
              section = '''## 3.7.14\n\n- Adds a shared deterministic recursive/path-aware privacy projection before exported raw-value source artifacts are committed; private immutable snapshot bytes and their authoritative hashes remain exact.\n- Separates successful empty Elementor/WordPress observations from failed observations, including bounded PARTIAL Environment evidence for optional URL-normalization failure.\n- Stamps committed artifacts with truthful `observed_at` provenance and persists one `packaging_started_at` across packaging retries; worker implementation compatibility advances to `3.7.14`.\n- Makes `plugin.manifest.json` authoritative for release inventory, rejects undeclared ordinary workspace files, validates all intended-equal release version authorities, and emits manifest/critical/source-inventory build fingerprints.\n- Moves normative generated validation reports under `release-build/validation-evidence/` and adds machine-checked Technical ID/schema synchronization for both collector encyclopedias.\n- Normalizes retryable and non-retryable failure scheduling through the existing recovery state machine so released failures cannot retain `REST_ADVANCE_ACTIVE`.\n- Adds focused privacy, observation, provenance, release-authority, documentation and recovery regression coverage plus exact final-build WordPress/Elementor qualification.\n- Preserves Bundle Schema `3.3.0`, Shared Artifact Envelope `2.0.0`, Package Manifest `2.1.0`, Selection Snapshot `1.2.0`, EDIS-CJ-2, EDIS-ZIP-1 and Browser/Python ownership boundaries.\n\n'''
              if marker not in text:
                  raise SystemExit('CHANGELOG 3.7.13 marker missing')
              text = text.replace(marker, section + marker, 1)
          changelog.write_text(text, encoding='utf-8')

          manifest_path = root / 'plugin.manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['platform_version'] = version
          manifest['plugin']['version'] = version
          manifest['build']['version'] = version
          manifest['build']['platform_version'] = version
          required_additions = {
              'src/Infrastructure/Support/PrivacyProjection.php': True,
              'tests/Unit/CorrectnessClosure314Test.php': False,
              'tests/Unit/EnvironmentObservation314Test.php': False,
              'tests/Unit/ReleaseAuthority314Test.php': False,
              'tests/release-authority-314.py': False,
          }
          entries = manifest.get('files')
          if not isinstance(entries, list):
              raise SystemExit('manifest files authority missing')
          existing = {entry.get('path'): entry for entry in entries if isinstance(entry, dict)}
          for path, installable in required_additions.items():
              if path in existing:
                  if existing[path].get('installable') is not installable:
                      raise SystemExit(f'manifest installable mismatch for {path}')
                  continue
              entries.append({'installable': installable, 'path': path})
          entries.sort(key=lambda entry: str(entry['path']).encode('utf-8'))
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')

          critical_path = root / 'config/critical-files.json'
          critical = json.loads(critical_path.read_text(encoding='utf-8'))
          critical['plugin_version'] = version
          critical_files = critical.get('files')
          if not isinstance(critical_files, dict):
              raise SystemExit('critical-files authority missing')
          critical_files.setdefault('src/Infrastructure/Support/PrivacyProjection.php', '')
          for relative in sorted(critical_files):
              path = root / relative
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f'critical file unavailable: {relative}')
              critical_files[relative] = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
          critical_path.write_text(json.dumps(critical, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

          rm .github/workflows/edis-finalize-3.7.14.yml

          git config user.name 'EDIS Final Qualification'
          git config user.email 'actions@users.noreply.github.com'
          git add edis-evidence-exporter.php package.json package-lock.json README.md readme.txt CHANGELOG.md plugin.manifest.json config/critical-files.json .github/workflows/edis-finalize-3.7.14.yml
          git commit -m 'release: finalize EDIS 3.7.14 correctness closure'
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short
      - name: Install repository dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
      - name: Run focused release-authority mutations
        run: python3 tests/release-authority-314.py
      - name: Run PHP, PHPUnit, PHPCS and asset gates
        run: |
          find . -path './vendor' -prune -o -path './release-build' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          vendor/bin/phpunit --configuration phpunit.xml.dist
          vendor/bin/phpcs --standard=phpcs.xml.dist
          php -d error_reporting=E_ALL -d display_errors=1 tests/runtime-smoke.php
          npm run lint:js
          npm run lint:css
          npm run lint:workflows:strict
      - name: Run local validation twice without source-authority mutation
        run: |
          python3 <<'PY' > /tmp/source-before.sha
          from pathlib import Path
          import hashlib
          root=Path('.')
          excluded={'.git','vendor','node_modules','release-build','.phpunit.cache'}
          h=hashlib.sha256()
          for p in sorted((p for p in root.rglob('*') if p.is_file() and not any(part in excluded for part in p.parts)), key=lambda p:p.as_posix().encode()):
              rel=p.as_posix().encode(); data=p.read_bytes(); h.update(len(rel).to_bytes(8,'big')); h.update(rel); h.update(len(data).to_bytes(8,'big')); h.update(data)
          print(h.hexdigest())
          PY
          mkdir -p release-build/validation-evidence
          php tools/validation/run-local-validation.php --report=release-build/validation-evidence/local-validation.json >/tmp/local-validation-1.json
          php tools/validation/run-local-validation.php --report=release-build/validation-evidence/local-validation.json >/tmp/local-validation-2.json
          python3 <<'PY' > /tmp/source-after.sha
          from pathlib import Path
          import hashlib
          root=Path('.')
          excluded={'.git','vendor','node_modules','release-build','.phpunit.cache'}
          h=hashlib.sha256()
          for p in sorted((p for p in root.rglob('*') if p.is_file() and not any(part in excluded for part in p.parts)), key=lambda p:p.as_posix().encode()):
              rel=p.as_posix().encode(); data=p.read_bytes(); h.update(len(rel).to_bytes(8,'big')); h.update(rel); h.update(len(data).to_bytes(8,'big')); h.update(data)
          print(h.hexdigest())
          PY
          cmp /tmp/source-before.sha /tmp/source-after.sha
      - name: Build exact deterministic release twice
        run: |
          rm -rf release-build/final-a release-build/final-b
          python3 tools/release/build-release.py --root "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/release-build/final-a"
          python3 tools/release/build-release.py --root "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/release-build/final-b"
          cmp release-build/final-a/edis-evidence-exporter-3.7.14.zip release-build/final-b/edis-evidence-exporter-3.7.14.zip
          cmp release-build/final-a/edis-evidence-exporter-3.7.14-source.zip release-build/final-b/edis-evidence-exporter-3.7.14-source.zip
          cmp release-build/final-a/edis-evidence-exporter-3.7.14-build-report.json release-build/final-b/edis-evidence-exporter-3.7.14-build-report.json
          cmp release-build/final-a/SHA256SUMS release-build/final-b/SHA256SUMS
      - name: Install exact final ZIP in WordPress 7.0 and Elementor 4.1.3
        run: |
          rm -rf /tmp/wordpress /tmp/edis-final-private
          mkdir -p /tmp/wordpress
          wp core download --path=/tmp/wordpress --version=7.0 --force
          wp config create --path=/tmp/wordpress --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp config set EDIS_EVIDENCE_PRIVATE_STORAGE_DIR /tmp/edis-final-private --path=/tmp/wordpress --type=constant
          wp config set WP_DEBUG true --raw --path=/tmp/wordpress --type=constant
          wp config set WP_DEBUG_LOG true --raw --path=/tmp/wordpress --type=constant
          wp core install --path=/tmp/wordpress --url=http://localhost --title='EDIS 3.7.14 Qualification' --admin_user=admin --admin_password=admin --admin_email=admin@example.test --skip-email
          wp plugin install elementor --version=4.1.3 --activate --path=/tmp/wordpress
          wp plugin install "$GITHUB_WORKSPACE/release-build/final-a/edis-evidence-exporter-3.7.14.zip" --activate --path=/tmp/wordpress
          wp plugin get edis-evidence-exporter --field=version --path=/tmp/wordpress | grep -Fx '3.7.14'
      - name: Run exact multi-document export qualification
        run: |
          cat > /tmp/edis-final-qualification.php <<'PHP'
          <?php
          declare(strict_types=1);
          use EDIS\EvidenceExporter\Admin\Settings\SettingsRepository;
          use EDIS\EvidenceExporter\Application\DiagnosticsService;
          use EDIS\EvidenceExporter\Application\ExportJobService;
          use EDIS\EvidenceExporter\Application\ExportService;
          use EDIS\EvidenceExporter\Infrastructure\Collector\CollectorRegistry;
          use EDIS\EvidenceExporter\Infrastructure\Support\ArtifactStore;
          use EDIS\EvidenceExporter\Infrastructure\Support\DeterministicFilesystem;
          use EDIS\EvidenceExporter\Infrastructure\Support\ExportFileStore;
          use EDIS\EvidenceExporter\Infrastructure\Support\InputSnapshotStore;
          use EDIS\EvidenceExporter\Infrastructure\Support\JobStore;
          use EDIS\EvidenceExporter\Infrastructure\Support\PrivateStorage;

          if (!defined('ABSPATH') || !defined('EDIS_EVIDENCE_EXPORTER_PATH')) { throw new RuntimeException('EDIS exact plugin root unavailable.'); }
          if (!did_action('elementor/loaded')) { throw new RuntimeException('Elementor did not load.'); }
          $ownerId = 1;
          wp_set_current_user($ownerId);
          $postIds = [];
          try {
              foreach ([1, 2] as $index) {
                  $postId = wp_insert_post(['post_type'=>'page','post_status'=>'publish','post_title'=>'EDIS qualification '.$index,'post_content'=>''], true);
                  if (is_wp_error($postId) || !is_int($postId) || $postId <= 0) { throw new RuntimeException('Could not create qualification document.'); }
                  $postIds[] = $postId;
                  $data = [[
                      'id' => 'root'.$index.'aaaa', 'elType'=>'container','isInner'=>false,'settings'=>[],
                      'elements'=>[['id'=>'head'.$index.'aaaa','elType'=>'widget','widgetType'=>'heading','settings'=>['title'=>'Qualification '.$index],'elements'=>[]]],
                  ]];
                  update_post_meta($postId, '_elementor_edit_mode', 'builder');
                  update_post_meta($postId, '_elementor_template_type', 'wp-page');
                  update_post_meta($postId, '_elementor_version', defined('ELEMENTOR_VERSION') ? ELEMENTOR_VERSION : '4.1.3');
                  update_post_meta($postId, '_elementor_data', wp_slash(wp_json_encode($data, JSON_UNESCAPED_SLASHES)));
              }
              $pluginRoot = EDIS_EVIDENCE_EXPORTER_PATH;
              $privateStorage = new PrivateStorage();
              $filesystem = new DeterministicFilesystem();
              $registry = CollectorRegistry::fromDefinitions(require $pluginRoot . 'config/collectors.php');
              $settings = new SettingsRepository();
              $jobs = new JobStore($privateStorage->path('jobs'), $filesystem);
              $artifacts = new ArtifactStore($privateStorage->path('artifacts'), $filesystem);
              $files = new ExportFileStore($settings, $privateStorage->path('bundles'), $filesystem);
              $inputs = new InputSnapshotStore($privateStorage->path('inputs'), null, $filesystem);
              $exporter = new ExportService($registry, $pluginRoot);
              $worker = new ExportJobService($registry, $exporter, $jobs, $artifacts, $files, $settings, $inputs, $privateStorage);
              $request = [
                  'privacy_mode'=>'Strict',
                  'collectors'=>$registry->defaultSelectableIds(),
                  'document_ids'=>$postIds,
                  'options'=>['include_original_documents'=>false,'export_scope'=>'MULTIPLE_DOCUMENTS','dependency_scope'=>'REQUIRED_DEPENDENCIES','compare_previous_export'=>false],
              ];
              $created = $worker->create($ownerId, $request);
              $jobId = (string)($created['job_id'] ?? '');
              if ($jobId === '') { throw new RuntimeException('No qualification job ID.'); }
              $terminal = null;
              for ($attempt=0; $attempt<30; $attempt++) {
                  $terminal = $worker->advance($jobId, $ownerId, null, 15000);
                  if (in_array((string)($terminal['status'] ?? ''), ['completed','failed','cancelled'], true)) { break; }
              }
              if (!is_array($terminal) || ($terminal['status'] ?? null)!=='completed' || ($terminal['phase'] ?? null)!=='completed' || (int)($terminal['progress'] ?? -1)!==100 || ($terminal['validation_state'] ?? null)!=='PASS') {
                  throw new RuntimeException('Exact final multi-document export did not complete with PASS.');
              }
              $stored = $jobs->get($jobId);
              if (!is_array($stored) || ($stored['implementation_version'] ?? null)!=='3.7.14' || ($stored['completed_components'] ?? null)!==($stored['selected_components'] ?? null)) {
                  throw new RuntimeException('Selected components were not fully accounted for under worker 3.7.14.');
              }
              $token = is_string($stored['download_token'] ?? null) ? $stored['download_token'] : '';
              $bundlePath = $token === '' ? null : $files->authorize($jobId, $token);
              if (!is_string($bundlePath) || !is_file($bundlePath)) { throw new RuntimeException('Download authorization/integrity verification failed.'); }
              $manifestBytes = $files->readStoredEntry($bundlePath, 'package-manifest.json');
              $validationBytes = $files->readStoredEntry($bundlePath, 'validation/package-validation.json');
              if (!is_string($manifestBytes) || !is_string($validationBytes)) { throw new RuntimeException('Required package entries unavailable.'); }
              $manifest = json_decode($manifestBytes, true, 512, JSON_THROW_ON_ERROR);
              $validation = json_decode($validationBytes, true, 512, JSON_THROW_ON_ERROR);
              if (($manifest['producer']['version'] ?? null)!=='3.7.14' || ($manifest['data']['bundle_schema_version'] ?? null)!=='3.3.0' || ($validation['data']['evidence']['state'] ?? null)!=='PASS') {
                  throw new RuntimeException('Final package identity/validation mismatch.');
              }
              $diagnostics = new DiagnosticsService($registry, $jobs, $artifacts, $files, $settings, $inputs, $worker, $pluginRoot, $filesystem);
              $identity = $diagnostics->report()['build_identity'] ?? null;
              if (!is_array($identity)) { throw new RuntimeException('Runtime build identity unavailable.'); }
              file_put_contents('/tmp/edis-runtime-build-identity.json', json_encode($identity, JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR));
              fwrite(STDOUT, "EDIS_FINAL_MULTI_DOCUMENT_QUALIFICATION_PASS job={$jobId}\n");
          } finally {
              foreach ($postIds as $postId) { wp_delete_post($postId, true); }
          }
          PHP
          wp eval-file /tmp/edis-final-qualification.php --path=/tmp/wordpress
      - name: Match runtime build identity to exact release report
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('release-build/final-a/edis-evidence-exporter-3.7.14-build-report.json').read_text())
          runtime = json.loads(Path('/tmp/edis-runtime-build-identity.json').read_text())
          release = report['build_identity']
          if runtime != release:
              raise SystemExit('T37 build_identity mismatch\nruntime='+json.dumps(runtime, sort_keys=True)+'\nrelease='+json.dumps(release, sort_keys=True))
          print('EDIS_T37_BUILD_IDENTITY_MATCH_PASS')
          PY
      - name: Emit final exact-head release evidence
        run: |
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          git diff --exit-code HEAD -- edis-evidence-exporter.php package.json package-lock.json README.md readme.txt CHANGELOG.md plugin.manifest.json config/critical-files.json src tests tools validation docs
          echo "FINAL_HEAD=$FINAL_HEAD"
          cat release-build/final-a/SHA256SUMS
          python3 - <<'PY'
          import json
          from pathlib import Path
