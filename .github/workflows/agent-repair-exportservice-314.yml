name: Agent repair ExportService 3.7.14

'on':
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/edis-wp-correctness-closure-v3.7.14' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: agent/edis-wp-correctness-closure-v3.7.14
          fetch-depth: 0
      - name: Restore locked-base file then apply bounded M03 delta
        shell: bash
        run: |
          git show origin/main:src/Application/ExportService.php > src/Application/ExportService.php
          python3 tools/agent/repair-exportservice-314.py
          php -l src/Application/ExportService.php
          git diff --check
      - name: Commit and remove temporary agent files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-repair-exportservice-314.yml
          git rm tools/agent/repair-exportservice-314.py
          git add src/Application/ExportService.php
          git commit -m 'EDIS 3.7.14: keep provenance patch minimal'
          git push origin HEAD:agent/edis-wp-correctness-closure-v3.7.14
