name: EDIS temporary critical hash refresh

'on':
  push:
    branches:
      - agent/edis-repository-wide-failure-conformance-v1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    name: Regenerate critical file hashes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: agent/edis-repository-wide-failure-conformance-v1
      - name: Regenerate existing critical file authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          path = pathlib.Path('config/critical-files.json')
          authority = json.loads(path.read_text(encoding='utf-8'))
          files = authority.get('files')
          if not isinstance(files, dict) or not files:
              raise SystemExit('critical file authority is invalid')
          updated = {}
          for relative in sorted(files):
              target = pathlib.Path(relative)
              if not target.is_file() or target.is_symlink():
                  raise SystemExit(f'critical file missing or unsafe: {relative}')
              updated[relative] = 'sha256:' + hashlib.sha256(target.read_bytes()).hexdigest()
          authority['files'] = updated
          path.write_text(json.dumps(authority, separators=(',', ':'), ensure_ascii=False), encoding='utf-8')
          PY
          changed="$(git diff --name-only)"
          test "$changed" = "config/critical-files.json"
      - name: Verify refreshed authority structure
        run: |
          php -r '$x=json_decode(file_get_contents("config/critical-files.json"),true,512,JSON_THROW_ON_ERROR); if(($x["format"]??"")!=="EDIS-INTEGRITY-1"||($x["hash_algorithm"]??"")!=="sha256"||!is_array($x["files"]??null)){exit(1);} foreach($x["files"] as $p=>$h){if(!is_file($p)||!hash_equals($h,"sha256:".hash_file("sha256",$p))){fwrite(STDERR,$p.PHP_EOL);exit(1);}}'
      - name: Commit only generated critical authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/critical-files.json
          git commit -m "chore: synchronize critical file hashes"
          git push origin HEAD:agent/edis-repository-wide-failure-conformance-v1
