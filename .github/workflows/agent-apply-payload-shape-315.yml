name: Agent apply payload shape 3.7.15

'on':
  workflow_dispatch:
  push:
    branches:
      - agent/edis-3.7.15-payload-shape-closure
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-apply-payload-shape-315
  cancel-in-progress: false

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: agent/edis-3.7.15-payload-shape-closure
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: json, iconv
      - name: Verify bound starting Head ancestry
        run: |
          git merge-base --is-ancestor 37ffb0ce1cd628c3e27d05b808384feda78f831e HEAD
          test "$(git diff --name-only 37ffb0ce1cd628c3e27d05b808384feda78f831e..HEAD | sort)" = $'.github/workflows/agent-apply-payload-shape-315.yml\ntools/agent/apply-payload-shape-315.py'
      - name: Apply selected methods
        run: python3 tools/agent/apply-payload-shape-315.py
      - name: Preserve npm lockfile formatting
        run: |
          git checkout 37ffb0ce1cd628c3e27d05b808384feda78f831e -- package.json package-lock.json
          npm version 3.7.15 --no-git-tag-version --allow-same-version
      - name: Remove temporary implementation authorities
        run: |
          git rm .github/workflows/agent-apply-payload-shape-315.yml
          git rm tools/agent/apply-payload-shape-315.py
      - name: Refresh critical-file authority after final source bytes
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path.cwd()
          path = root / 'config/critical-files.json'
          value = json.loads(path.read_text(encoding='utf-8'))
          value['plugin_version'] = '3.7.15'
          value['files'] = {
              relative: 'sha256:' + hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in sorted(value['files'], key=lambda item: item.encode('utf-8'))
          }
          path.write_text(json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
      - name: Install locked dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          composer audit --locked
          npm ci
      - name: Run focused payload-shape and compatibility tests
        run: |
          vendor/bin/phpunit --configuration phpunit.xml.dist --filter 'ElementorPayloadContractRegressionTest|ExportJobIntegrityTest'
          python3 tests/release-authority-314.py
      - name: Run full repository validation
        run: |
          find . -path './vendor' -prune -o -path './node_modules' -prune -o -path './release-build' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          vendor/bin/phpunit --configuration phpunit.xml.dist
          vendor/bin/phpcs --standard=phpcs.xml.dist
          php -d error_reporting=E_ALL -d display_errors=1 tests/runtime-smoke.php
          npm run lint:js
          npm run lint:css
          npm run lint:workflows:strict
          git diff --check
      - name: Run repository local validation evidence
        run: php tools/validation/run-local-validation.php --report=release-build/validation-evidence/local-validation.json
      - name: Build deterministic release twice
        run: |
          rm -rf release-build/payload-shape-315-a release-build/payload-shape-315-b
          python3 tools/release/build-release.py --root . --output release-build/payload-shape-315-a
          python3 tools/release/build-release.py --root . --output release-build/payload-shape-315-b
          cmp release-build/payload-shape-315-a/edis-evidence-exporter-3.7.15.zip release-build/payload-shape-315-b/edis-evidence-exporter-3.7.15.zip
          cmp release-build/payload-shape-315-a/edis-evidence-exporter-3.7.15-source.zip release-build/payload-shape-315-b/edis-evidence-exporter-3.7.15-source.zip
          cmp release-build/payload-shape-315-a/edis-evidence-exporter-3.7.15-build-report.json release-build/payload-shape-315-b/edis-evidence-exporter-3.7.15-build-report.json
          sha256sum --check --strict release-build/payload-shape-315-a/SHA256SUMS
          sha256sum --check --strict release-build/payload-shape-315-b/SHA256SUMS
      - name: Commit and push bounded repair
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'fix: close payload shape contracts for 3.7.15'
          CANDIDATE_SHA=$(git rev-parse HEAD)
          printf 'candidate_sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$CANDIDATE_SHA" > release-build/payload-shape-315-candidate-sha.txt
          git push origin HEAD:agent/edis-3.7.15-payload-shape-closure
      - name: Capture release evidence summary
        env:
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('release-build/payload-shape-315-a')
          report = json.loads((root / 'edis-evidence-exporter-3.7.15-build-report.json').read_text(encoding='utf-8'))
          summary = {
              'candidate_sha': os.environ['CANDIDATE_SHA'],
              'version': '3.7.15',
              'install': report['install'],
              'source': report['source'],
              'plugin_manifest_sha256': report['plugin_manifest_sha256'],
              'critical_files_manifest_sha256': report['critical_files_manifest_sha256'],
              'source_inventory_sha256': report['source_inventory_sha256'],
              'duplicate_build_byte_equal': True,
          }
          Path('release-build/payload-shape-315-evidence.json').write_text(json.dumps(summary, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Upload bounded release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edis-3.7.15-payload-shape-evidence
          path: |
            release-build/payload-shape-315-a/
            release-build/payload-shape-315-b/
            release-build/validation-evidence/local-validation.json
            release-build/payload-shape-315-candidate-sha.txt
            release-build/payload-shape-315-evidence.json
          if-no-files-found: error
          retention-days: 14
