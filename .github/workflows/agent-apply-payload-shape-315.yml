name: Export locked PR6 source snapshot

'on':
  push:
    branches:
      - agent/edis-3.7.15-payload-shape-closure
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr6-locked-source-snapshot-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout locked reviewed head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 5190c4cc983ec2d0638f05baab80ca50f64c33ac
          fetch-depth: 0
      - name: Assert locked reviewed head
        shell: bash
        run: |
          set -euo pipefail
          expected=5190c4cc983ec2d0638f05baab80ca50f64c33ac
          actual="$(git rev-parse HEAD)"
          printf 'EXPECTED_HEAD_SHA=%s\nACTUAL_HEAD_SHA=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
      - name: Create source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/edis-pr6-snapshot
          tar --exclude='./.git' --exclude='./release-build/snapshot' -czf /tmp/edis-pr6-snapshot/source.tar.gz .
          git bundle create /tmp/edis-pr6-snapshot/repository.bundle --all
          sha256sum /tmp/edis-pr6-snapshot/source.tar.gz /tmp/edis-pr6-snapshot/repository.bundle | tee /tmp/edis-pr6-snapshot/SHA256SUMS
      - name: Upload locked source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edis-pr6-locked-source-5190c4c
          path: /tmp/edis-pr6-snapshot
          if-no-files-found: error
          retention-days: 3
