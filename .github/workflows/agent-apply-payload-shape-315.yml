name: Export locked PR6 recovery evidence

'on':
  push:
    branches:
      - agent/edis-3.7.15-payload-shape-closure
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr6-locked-recovery-evidence-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout locked reviewed head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 5190c4cc983ec2d0638f05baab80ca50f64c33ac
          fetch-depth: 1
      - name: Assert locked reviewed head
        shell: bash
        run: |
          set -euo pipefail
          expected=5190c4cc983ec2d0638f05baab80ca50f64c33ac
          actual="$(git rev-parse HEAD)"
          printf 'EXPECTED_HEAD_SHA=%s\nACTUAL_HEAD_SHA=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
      - name: Export recovery evidence read-only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          chunk_shas = [
              'fe9b349947b189385bc7c922ae8438a4be73937a',
              '15a370bd94000866c3f5cdcecd0a80f8d50b5ada',
              'e278c0cc80bd6ca0564ec891007b21603844b83b',
              'd6f57042b61ea5902fcfe6e0ae39fb28fc2f8a3c',
              '32a30fef504077c3ed18d77d574f248f583b066d',
              '06f44c912596cf686cae26debf3f2dca7b85d84d',
              'c30d3f015ed92da61d642318ad21750449b769e6',
              '43e48b836e5cf80890bd1bbcd005e31087b5d7bc',
              '796eac83c56a95cb4c7284868008b7c20fc0b878',
              'cefaa58a8ffc5afaac617b009b6e76405753a228',
              '5fb26eeca636435ea5f45bcea162ad72ebec595b',
              'e673b8849aada7df2b3b67fe57f54977aeaa22a1',
              '505899f0fb08fa0fa894af9ba76a0f3919da7f66',
              '620351cabd26ed6c5123075f22ae69cb24db16be',
              '21a12a6e8583fc019e1d81e9068cc980542fca16',
              'ad907acf7143490fd76e4bcb0153dba28cbd0ada',
              'b55f1c44d995d09ea7d53f7e6356cefe6d3cdf30',
          ]
          missing = [
              'd6f57042b61ea5902fcfe6e0ae39fb28fc2f8a3c',
              '32a30fef504077c3ed18d77d574f248f583b066d',
          ]
          expected_files = {
              '.github/workflows/quality.yml': '77afa47e7d38832198570e94fa6d2263da3ca1fc',
              'CHANGELOG.md': '984318d4a18745ba18ce02a5b7ebd52634419551',
              'README.md': 'a51a0c39ff22557a972369803933dd9c27d14afa',
              'config/collectors.php': 'a82dabd841e47b3c87acef174a39bef0e74a74a7',
              'docs/collector-encyclopedia-fa.md': '0adbe636fb02211ac937d6619980ff982ff9ed6a',
              'docs/collector-encyclopedia.md': '750f3c8b78dc376c6dd1754791844995b5283496',
              'languages/edis-evidence-exporter-fa_IR.po': '395dfaa0f27cc4dc2a52c22801253ab8791f8635',
              'languages/edis-evidence-exporter.pot': 'bab7836f32041146a3b3f8dab29aeb6e3bc31361',
              'plugin.manifest.json': 'ab11528eeeb8285a52ecf9aa39c7066a39485713',
              'readme.txt': '8dbf4919b690383ba3c898005a8be4a4de6db460',
              'tests/Unit/RootCompleteRepairTest.php': '00c0d7c68412c36a191f54b21619fdc50f384d55',
              'tests/release-authority-314.py': '3ee57b432533ca96bf5a93a81bc74528cd576f66',
          }
          output = Path('/tmp/edis-pr6-recovery-evidence')
          chunks = output / 'chunks'
          transport = output / 'transport'
          chunks.mkdir(parents=True)
          transport.mkdir(parents=True)

          def git_blob_sha(raw):
              return hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()

          for sha in chunk_shas:
              if sha in missing:
                  continue
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)
              raw = base64.b64decode(payload['content'])
              if git_blob_sha(raw) != sha:
                  raise SystemExit(f'chunk mismatch: {sha}')
              (chunks / sha).write_bytes(raw)

          for path in sorted(Path('release-build/blob-assembly/transport').glob('*.b64')):
              (transport / path.name).write_bytes(path.read_bytes())

          metadata = {
              'starting_head': '5190c4cc983ec2d0638f05baab80ca50f64c33ac',
              'chunk_shas': chunk_shas,
              'missing': missing,
              'archive_sha256': '6b50686b52ce0fe888f14cbd9ab24b0fe1d4e22f05afb8a35af4caa9f939fd46',
              'expected_files': expected_files,
          }
          (output / 'metadata.json').write_text(json.dumps(metadata, sort_keys=True, indent=2) + '\n')
          PY
          find /tmp/edis-pr6-recovery-evidence -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/edis-pr6-recovery-evidence/SHA256SUMS
      - name: Upload locked recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edis-pr6-recovery-evidence-5190c4c
          path: /tmp/edis-pr6-recovery-evidence
          if-no-files-found: error
          retention-days: 3
