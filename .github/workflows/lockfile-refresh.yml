name: EDIS temporary lockfile refresh

'on':
  push:
    branches:
      - agent/edis-repository-wide-failure-conformance-v1

permissions:
  contents: read

jobs:
  refresh:
    name: Generate secure Composer lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: json, iconv
      - name: Refresh affected development dependency
        run: composer update squizlabs/php_codesniffer --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Verify secure lockfile
        run: |
          composer validate --strict
          composer audit --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secure-composer-lock
          path: composer.lock
          if-no-files-found: error
          retention-days: 1
