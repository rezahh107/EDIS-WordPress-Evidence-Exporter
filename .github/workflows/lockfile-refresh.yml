name: EDIS temporary lockfile refresh

'on':
  push:
    branches:
      - agent/edis-repository-wide-failure-conformance-v1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    name: Commit secure Composer lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: agent/edis-repository-wide-failure-conformance-v1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: json, iconv
      - name: Refresh affected development dependency
        run: composer update squizlabs/php_codesniffer --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Verify secure lockfile
        run: |
          composer validate --strict
          composer audit --locked
      - name: Commit only generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "composer.lock"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- composer.lock
          git commit -m "chore: refresh secure Composer lockfile"
          git push origin HEAD:agent/edis-repository-wide-failure-conformance-v1
