name: EDIS REST dispatch contract finalization

'on':
  push:
    branches:
      - agent/edis-canonical-llm-diagnostic-record-v1
    paths:
      - .github/workflows/finalize-rest-dispatch-contract.yml
      - tools/validation/finalize-rest-dispatch-contract.py

permissions:
  contents: write

concurrency:
  group: edis-rest-dispatch-contract-finalization
  cancel-in-progress: false

jobs:
  finalize:
    name: Normalize real REST dispatch assertions and authorities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Verify exact seed checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: json, iconv
      - name: Apply bounded REST dispatch finalization
        run: |
          set -euo pipefail
          python -m py_compile tools/validation/finalize-rest-dispatch-contract.py
          python tools/validation/finalize-rest-dispatch-contract.py
          rm -rf tools/validation/__pycache__
      - name: Install and validate bounded candidate
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          php -l tests/integration/canonical-diagnostic-rest.php
          vendor/bin/phpunit --configuration phpunit.xml.dist
          vendor/bin/phpcs --standard=phpcs.xml.dist
          python tests/release-authority-314.py
          rm -rf /tmp/edis-rest-final-a /tmp/edis-rest-final-b
          python tools/release/build-release.py --root . --output /tmp/edis-rest-final-a
          python tools/release/build-release.py --root . --output /tmp/edis-rest-final-b
          diff -qr /tmp/edis-rest-final-a /tmp/edis-rest-final-b
          git diff --check
          test ! -e .github/workflows/finalize-rest-dispatch-contract.yml
          test ! -e tools/validation/finalize-rest-dispatch-contract.py
      - name: Commit and push bounded result
        env:
          TARGET_BRANCH: agent/edis-canonical-llm-diagnostic-record-v1
          SEED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$SEED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/canonical-diagnostic-rest.php plugin.manifest.json config/critical-files.json
          git add -u .github/workflows/finalize-rest-dispatch-contract.yml tools/validation/finalize-rest-dispatch-contract.py
          git diff --cached --quiet && { echo 'No dispatch-contract changes were produced.' >&2; exit 1; }
          git commit -m 'test: align real REST dispatch assertions'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'RESULTING_HEAD_SHA=%s\n' "$(git rev-parse HEAD)"
