name: EDIS implementation evidence export

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Prepare implementation evidence
        run: |
          mkdir -p "$RUNNER_TEMP/edis-implementation-evidence"
          sha256sum \
            edis-evidence-exporter.php \
            plugin.manifest.json \
            src/Application/ExportService.php \
            src/Infrastructure/Support/PrivateStorage.php \
            src/WordPress/DegradedModeIntegration.php \
            > "$RUNNER_TEMP/edis-implementation-evidence/critical-hashes.txt"
          tar --exclude=.git -czf "$RUNNER_TEMP/edis-implementation-evidence/source.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edis-implementation-evidence
          path: ${{ runner.temp }}/edis-implementation-evidence/
          if-no-files-found: error
          retention-days: 1
