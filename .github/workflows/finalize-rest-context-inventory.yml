name: EDIS REST context inventory finalization

'on':
  push:
    branches:
      - agent/edis-canonical-llm-diagnostic-record-v1
    paths:
      - .github/workflows/finalize-rest-context-inventory.yml
      - tools/validation/finalize-rest-context-inventory.py

permissions:
  contents: write

concurrency:
  group: edis-rest-context-inventory-finalization
  cancel-in-progress: false

jobs:
  finalize:
    name: Register checkout fixture and synchronize authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Verify exact seed checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Apply bounded inventory finalization
        run: |
          set -euo pipefail
          python -m py_compile tools/validation/finalize-rest-context-inventory.py
          python tools/validation/finalize-rest-context-inventory.py
          rm -rf tools/validation/__pycache__
      - name: Validate bounded result
        run: |
          set -euo pipefail
          python -m json.tool plugin.manifest.json >/dev/null
          python -m json.tool config/critical-files.json >/dev/null
          grep -Fx '/tests' .distignore
          grep -F 'tests/integration/rest-request-context.php' plugin.manifest.json
          grep -F 'installable":false' plugin.manifest.json
          grep -F 'wp --require="$GITHUB_WORKSPACE/tests/integration/rest-request-context.php" eval-file' .github/workflows/quality.yml
          git diff --check
          test ! -e .github/workflows/finalize-rest-context-inventory.yml
          test ! -e tools/validation/finalize-rest-context-inventory.py
      - name: Commit and push bounded authority result
        env:
          TARGET_BRANCH: agent/edis-canonical-llm-diagnostic-record-v1
          SEED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$SEED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin.manifest.json config/critical-files.json
          git add -u .github/workflows/finalize-rest-context-inventory.yml tools/validation/finalize-rest-context-inventory.py
          git diff --cached --quiet && { echo 'No inventory changes were produced.' >&2; exit 1; }
          git commit -m 'chore: register REST context fixture authority'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'RESULTING_HEAD_SHA=%s\n' "$(git rev-parse HEAD)"
