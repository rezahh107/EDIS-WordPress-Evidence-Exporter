name: PR8 quality candidate emitter

on:
  push:
    branches:
      - agent/edis-canonical-llm-diagnostic-record-v1
    paths:
      - .github/workflows/pr8-followup-apply.yml

permissions:
  contents: write

jobs:
  emit:
    if: contains(github.event.head_commit.message, '[emit-pr8-quality]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - name: Generate the exact quality workflow candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/quality.yml').read_text(encoding='utf-8')
          php_anchor = "      - if: matrix.php == '8.4'\n        run: npm run lint:js && npm run lint:css && npm run lint:workflows:strict\n"
          php_step = """      - name: Verify separated release identities and two independent builds
                  if: matrix.php == '8.4'
                  run: |
                    python tests/release-authority-314.py
                    rm -rf /tmp/edis-release-a /tmp/edis-release-b
                    python tools/release/build-release.py --root . --output /tmp/edis-release-a
                    python tools/release/build-release.py --root . --output /tmp/edis-release-b
                    diff -qr /tmp/edis-release-a /tmp/edis-release-b
                    (cd /tmp/edis-release-a && sha256sum * | sort) > /tmp/edis-release-a.sha256
                    (cd /tmp/edis-release-b && sha256sum * | sort) > /tmp/edis-release-b.sha256
                    diff -u /tmp/edis-release-a.sha256 /tmp/edis-release-b.sha256
          """
          if source.count(php_anchor) != 1:
              raise SystemExit('PHP quality anchor changed unexpectedly.')
          source = source.replace(php_anchor, php_anchor + php_step, 1)

          wp_anchor = "      - name: Verify Site Health, privacy hooks and filesystem preflight\n"
          wp_step = """      - name: Verify exact canonical Diagnostic REST bytes and authorization
                  if: matrix.wordpress == '7.0'
                  run: wp eval-file /tmp/wordpress/wp-content/plugins/edis-evidence-exporter/tests/integration/canonical-diagnostic-rest.php --path=/tmp/wordpress
          """
          if source.count(wp_anchor) != 1:
              raise SystemExit('WordPress quality anchor changed unexpectedly.')
          source = source.replace(wp_anchor, wp_step + wp_anchor, 1)

          target = Path('validation/pr8-quality.generated.yml.txt')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(source, encoding='utf-8')
          PY
      - name: Commit only the non-workflow candidate file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/pr8-quality.generated.yml.txt
          git diff --cached --check
          git commit -m "chore: emit PR8 quality workflow candidate"
          git push origin HEAD:agent/edis-canonical-llm-diagnostic-record-v1
