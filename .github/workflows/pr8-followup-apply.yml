name: PR8 follow-up applicator

on:
  push:
    branches:
      - agent/edis-canonical-llm-diagnostic-record-v1
    paths:
      - tools/ci/apply-pr8-followup.py
      - .github/workflows/pr8-followup-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-pr8-followup]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 12
          ref: ${{ github.sha }}
      - name: Verify bounded starting ancestry and staging-only delta
        run: |
          git merge-base --is-ancestor 69bb9ab30c1be0c757672ce18cd9b1af4fcff2a2 HEAD
          unexpected="$(git diff --name-only 69bb9ab30c1be0c757672ce18cd9b1af4fcff2a2...HEAD | grep -Ev '^(tools/ci/apply-pr8-followup.py|\.github/workflows/pr8-followup-apply.yml)$' || true)"
          test -z "$unexpected"
      - name: Normalize the verified store guard for the bounded applicator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/Infrastructure/Support/DiagnosticRecordStore.php')
          text = path.read_text(encoding='utf-8')
          old = """        $expiresAt = strtotime((string) ($identity['expires_at'] ?? ''));
                  if ($expiresAt === false || $expiresAt < time()) {
                      throw new \\InvalidArgumentException('A future diagnostic expiry is required.');
                  }
          """
          new = """        $expiresAt = strtotime((string) ($identity['expires_at'] ?? ''));
                  if ($expiresAt < time()) {
                      throw new \\InvalidArgumentException('Diagnostic record is already expired.');
                  }
          """
          if text.count(old) != 1:
              raise SystemExit('Verified DiagnosticRecordStore guard changed unexpectedly.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply locked repair
        run: |
          python - <<'PY'
          import ast
          import base64
          import re
          import zlib
          from pathlib import Path
          payload_path = Path('tools/ci/apply-pr8-followup.py').resolve()
          bootstrap = payload_path.read_text(encoding='utf-8')
          match = re.search(r"b64decode\((?P<literal>'[^']+')\)", bootstrap)
          if match is None:
              raise SystemExit('Bounded applicator payload was not found.')
          source = zlib.decompress(base64.b64decode(ast.literal_eval(match.group('literal')))).decode('utf-8')
          old = "updated, count = re.subn(pattern, replacement, content, count=1, flags=flags)"
          new = "replacer = (lambda match: match.expand(replacement)) if '\\\\1' in replacement else (lambda match: replacement)\n    updated, count = re.subn(pattern, replacer, content, count=1, flags=flags)"
          if source.count(old) != 1:
              raise SystemExit('Bounded regex helper changed unexpectedly.')
          source = source.replace(old, new, 1)
          old_expiry = '''regex_once(
              "src/Application/DiagnosticRecordService.php",
              r"(\\$diagnosticId,\\n            \\$recordType,\\n            \\$createdAt,\\n            )\\$this->store->expiration\\([^\\n]*\\),",
              r"\\1$expiresAt,",
          )'''
          new_expiry = '''replace_once(
              "src/Application/DiagnosticRecordService.php",
              "$this->store->expiration(isset($job['expires_at']) && is_numeric($job['expires_at']) ? (int) $job['expires_at'] : null),",
              "$expiresAt,",
          )'''
          if source.count(old_expiry) != 1:
              raise SystemExit('Bounded Job expiry replacement changed unexpectedly.')
          source = source.replace(old_expiry, new_expiry, 1)
          old_bootstrap = '''replace_once(
              "src/Bootstrap.php",
              """            add_action('rest_api_init', [$diagnosticExportJobs, 'registerRoutes']);\n            add_action('rest_api_init', [new DiagnosticsController($diagnostics), 'registerRoutes']);\n""",
              """            add_action('rest_api_init', [$diagnosticExportJobs, 'registerRoutes']);\n            CanonicalDiagnosticResponseAdapter::register();\n            add_action('rest_api_init', [new DiagnosticsController($diagnostics), 'registerRoutes']);\n""",
          )'''
          new_bootstrap = '''replace_once(
              "src/Bootstrap.php",
              "\\t\\t\\tadd_action( 'rest_api_init', array( new DiagnosticsController( $diagnostics ), 'registerRoutes' ) );",
              "\\t\\t\\tCanonicalDiagnosticResponseAdapter::register();\\n\\t\\t\\tadd_action( 'rest_api_init', array( new DiagnosticsController( $diagnostics ), 'registerRoutes' ) );",
          )'''
          if source.count(old_bootstrap) != 1:
              raise SystemExit('Bounded Bootstrap adapter replacement changed unexpectedly.')
          source = source.replace(old_bootstrap, new_bootstrap, 1)
          namespace = {'__file__': str(payload_path), '__name__': '__main__'}
          exec(compile(source, str(payload_path), 'exec'), namespace, namespace)
          PY
      - name: Validate generated syntax
        run: |
          python -m py_compile tools/release/build-release.py tests/release-authority-314.py
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
          node tests/diagnostics-envelope.test.mjs
      - name: Commit repair to existing PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: complete diagnostic authority follow-up"
          git push origin HEAD:agent/edis-canonical-llm-diagnostic-record-v1
