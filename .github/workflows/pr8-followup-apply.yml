name: PR8 follow-up applicator

on:
  push:
    branches:
      - agent/edis-canonical-llm-diagnostic-record-v1
    paths:
      - tools/ci/apply-pr8-followup.py
      - .github/workflows/pr8-followup-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-pr8-followup]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 32
          ref: ${{ github.sha }}
      - name: Verify bounded starting ancestry and staging-only delta
        run: |
          git merge-base --is-ancestor 69bb9ab30c1be0c757672ce18cd9b1af4fcff2a2 HEAD
          unexpected="$(git diff --name-only 69bb9ab30c1be0c757672ce18cd9b1af4fcff2a2...HEAD | grep -Ev '^(tools/ci/apply-pr8-followup.py|\.github/workflows/pr8-followup-apply.yml)$' || true)"
          test -z "$unexpected"
      - name: Normalize the verified store guard for the bounded applicator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/Infrastructure/Support/DiagnosticRecordStore.php')
          text = path.read_text(encoding='utf-8')
          old = """        $expiresAt = strtotime((string) ($identity['expires_at'] ?? ''));
                  if ($expiresAt === false || $expiresAt < time()) {
                      throw new \\InvalidArgumentException('A future diagnostic expiry is required.');
                  }
          """
          new = """        $expiresAt = strtotime((string) ($identity['expires_at'] ?? ''));
                  if ($expiresAt < time()) {
                      throw new \\InvalidArgumentException('Diagnostic record is already expired.');
                  }
          """
          if text.count(old) != 1:
              raise SystemExit('Verified DiagnosticRecordStore guard changed unexpectedly.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply locked repair
        run: |
          python - <<'PY'
          import ast
          import base64
          import re
          import zlib
          from pathlib import Path
          payload_path = Path('tools/ci/apply-pr8-followup.py').resolve()
          bootstrap = payload_path.read_text(encoding='utf-8')
          match = re.search(r"b64decode\((?P<literal>'[^']+')\)", bootstrap)
          if match is None:
              raise SystemExit('Bounded applicator payload was not found.')
          source = zlib.decompress(base64.b64decode(ast.literal_eval(match.group('literal')))).decode('utf-8')
          old = "updated, count = re.subn(pattern, replacement, content, count=1, flags=flags)"
          new = "replacer = (lambda match: match.expand(replacement)) if '\\\\1' in replacement else (lambda match: replacement)\n    updated, count = re.subn(pattern, replacer, content, count=1, flags=flags)"
          if source.count(old) != 1:
              raise SystemExit('Bounded regex helper changed unexpectedly.')
          source = source.replace(old, new, 1)
          old_expiry = '''regex_once(
              "src/Application/DiagnosticRecordService.php",
              r"(\\$diagnosticId,\\n            \\$recordType,\\n            \\$createdAt,\\n            )\\$this->store->expiration\\([^\\n]*\\),",
              r"\\1$expiresAt,",
          )'''
          new_expiry = '''replace_once(
              "src/Application/DiagnosticRecordService.php",
              "$this->store->expiration(isset($job['expires_at']) && is_numeric($job['expires_at']) ? (int) $job['expires_at'] : null),",
              "$expiresAt,",
          )'''
          if source.count(old_expiry) != 1:
              raise SystemExit('Bounded Job expiry replacement changed unexpectedly.')
          source = source.replace(old_expiry, new_expiry, 1)
          marker = "$diagnosticExportJobs"
          marker_index = source.find(marker)
          if marker_index < 0:
              raise SystemExit('Bounded Bootstrap marker was not found.')
          block_start = source.rfind('replace_once(', 0, marker_index)
          block_end = source.find('\n\n# CL-ENV-001', marker_index)
          if block_start < 0 or block_end < 0:
              raise SystemExit('Bounded Bootstrap replacement block was not found.')
          new_bootstrap = '''replace_once(
              "src/Bootstrap.php",
              "\\t\\t\\tadd_action( 'rest_api_init', array( new DiagnosticsController( $diagnostics ), 'registerRoutes' ) );",
              "\\t\\t\\tCanonicalDiagnosticResponseAdapter::register();\\n\\t\\t\\tadd_action( 'rest_api_init', array( new DiagnosticsController( $diagnostics ), 'registerRoutes' ) );",
          )'''
          source = source[:block_start] + new_bootstrap + source[block_end:]
          release_marker = '"tools/release/build-release.py"'
          release_index = source.find(release_marker)
          if release_index < 0:
              raise SystemExit('Bounded release predicate marker was not found.')
          release_start = source.rfind('replace_once(', 0, release_index)
          release_end = source.find('\n# Existing release test fixture', release_index)
          if release_start < 0 or release_end < 0:
              raise SystemExit('Bounded release predicate block was not found.')
          new_release = '''regex_once(
              "tools/release/build-release.py",
              r'    if worker_version != plugin_version:\\n        raise RuntimeError\\(f"[^"\\n]+"\\)\\n\\n',
              "",
          )'''
          source = source[:release_start] + new_release + source[release_end:]
          quality_start = source.find('# Update quality workflow using bounded insertions.')
          quality_end = source.find('# Synchronize critical hashes after all production/asset/manifest bytes stabilize.')
          if quality_start < 0 or quality_end < 0:
              raise SystemExit('Bounded quality workflow patch block was not found.')
          quality_patch = r'''# Update quality workflow using exact live anchors.
workflow = read(".github/workflows/quality.yml")
needle = "      - if: matrix.php == '8.4'\n        run: npm run lint:js && npm run lint:css && npm run lint:workflows:strict\n"
if workflow.count(needle) != 1:
    raise RuntimeError("quality workflow live JS lane anchor missing")
workflow = workflow.replace(needle, needle + "      - name: Verify separated release identities and two independent builds\n        if: matrix.php == '8.4'\n        run: |\n          python tests/release-authority-314.py\n          rm -rf /tmp/edis-release-a /tmp/edis-release-b\n          python tools/release/build-release.py --root . --output /tmp/edis-release-a\n          python tools/release/build-release.py --root . --output /tmp/edis-release-b\n          diff -qr /tmp/edis-release-a /tmp/edis-release-b\n          (cd /tmp/edis-release-a && sha256sum * | sort) > /tmp/edis-release-a.sha256\n          (cd /tmp/edis-release-b && sha256sum * | sort) > /tmp/edis-release-b.sha256\n          diff -u /tmp/edis-release-a.sha256 /tmp/edis-release-b.sha256\n", 1)
wp_anchor = "      - name: Verify Site Health, privacy hooks and filesystem preflight\n"
if workflow.count(wp_anchor) != 1:
    raise RuntimeError("quality workflow live WordPress anchor missing")
workflow = workflow.replace(wp_anchor, "      - name: Verify exact canonical Diagnostic REST bytes and authorization\n        if: matrix.wordpress == '7.0'\n        run: wp eval-file /tmp/wordpress/wp-content/plugins/edis-evidence-exporter/tests/integration/canonical-diagnostic-rest.php --path=/tmp/wordpress\n" + wp_anchor, 1)
write(".github/workflows/quality.yml", workflow)

'''
          source = source[:quality_start] + quality_patch + source[quality_end:]
          namespace = {'__file__': str(payload_path), '__name__': '__main__'}
          exec(compile(source, str(payload_path), 'exec'), namespace, namespace)
          PY
      - name: Remove bounded applicator from final tree
        run: rm -f tools/ci/apply-pr8-followup.py .github/workflows/pr8-followup-apply.yml
      - name: Validate generated syntax
        run: |
          python -m py_compile tools/release/build-release.py tests/release-authority-314.py
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
          node tests/diagnostics-envelope.test.mjs
      - name: Commit repair to existing PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: complete diagnostic authority follow-up"
          git push origin HEAD:agent/edis-canonical-llm-diagnostic-record-v1
